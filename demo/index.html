<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sedi with Clicky Lite</title>
  <meta name="description" content="Live demo: Sedi, Nitai Weinberg's workspace app, with Clicky Lite as its help button. An independent product sense case study, not affiliated with Clicky.">
  <meta name="theme-color" content="#59b2ec">
  <link rel="icon" href="../assets/clicky-lite-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="demo-chrome.css">
  <script src="sedi-sandbox.js"></script>
  <script src="brain/library.js" defer></script>
  <script src="sedi.bundle.js" defer></script>
  <!-- Clicky Lite. A normal install is one tag:
       <script src="clicky-lite.js" data-clicky-pack="clicky-pack.json" defer></script>
       The demo embeds the pack instead, so it also works inside sandboxed previews. -->
  <script src="../sdk/clicky-lite.js" data-clicky-auto="false" defer></script>
  <script src="clicky-pack.js" defer></script>
  <script src="clicky-init.js" defer></script>
</head>
<body data-route="home">
  <div class="cl-strip" role="note" data-clicky-ignore>
    <a href="../index.html" aria-label="Clicky Lite case study"><img src="../assets/clicky-lite-mark.svg" alt="" width="16" height="16"><span class="cl-label">case study</span></a>
    <span><b>clicky lite only sees sedi</b> · nothing to download<span class="long"> · not affiliated with clicky</span></span>
    <span class="cl-hint">press <b>help</b> in the top right ↗</span>
  </div>
  <div id="app">
    <noscript>Sedi needs JavaScript to run.</noscript>
  </div>
</body>
</html>
